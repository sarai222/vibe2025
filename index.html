<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    body          { font-family: Arial, sans-serif; }
    table         { width: 100%; border-collapse: collapse; }
    th, td        { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th            { background: #f0f0f0; }
    .btn          { padding: 4px 8px; cursor: pointer; border: none; }
    .add-btn      { background: #6cc; }
    .edit-btn     { background: #ffc107; }
    .delete-btn   { background: #f44336; color: #fff; }
    .btn:hover    { opacity: .8; }
    input[type="text"] { width: 90%; padding: 4px; }
  </style>
</head>
<body>

<h1>Todo List</h1>

<!-- форма добавления -->
<form id="add-form">
  <input type="text" id="new-item" placeholder="New task" required />
  <button type="submit" class="btn add-btn">Add</button>
</form>

<!-- таблица задач -->
<table>
  <thead>
    <tr><th>№</th><th>Task</th><th>Actions</th></tr>
  </thead>
  <tbody id="todo-list"></tbody>
</table>

<script>
  // загрузка задач
  async function loadList () {
    try {
      const res   = await fetch('/tasks');
      const tasks = await res.json();

      const tbody = document.getElementById('todo-list');
      tbody.innerHTML = '';               // очистка

      tasks.forEach((t, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td><span id="text-${t.id}">${t.text}</span></td>
          <td>
            <button class="btn edit-btn" data-id="${t.id}">Edit</button>
            <button class="btn delete-btn" data-id="${t.id}">×</button>
          </td>`;
        tbody.appendChild(tr);
      });

      // навешиваем обработчики после рендера
      tbody.querySelectorAll('.delete-btn').forEach(btn =>
        btn.onclick = () => removeTask(btn.dataset.id));

      tbody.querySelectorAll('.edit-btn').forEach(btn =>
        btn.onclick = () => startEdit(btn.dataset.id));
    } catch (err) {
      alert('Cannot load tasks');
      console.error(err);
    }
  }

  // добавление
  document.getElementById('add-form').onsubmit = async e => {
    e.preventDefault();
    const inp = document.getElementById('new-item');
    const text = inp.value.trim();
    if (!text) return;

    await fetch('/add', {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify({ text })
    });

    inp.value = '';
    loadList();
  };

  // удаление
  async function removeTask (id) {
    await fetch(`/delete/${id}`, { method: 'DELETE' });
    loadList();
  }

  // редактирование
  function startEdit (id) {
    const span  = document.getElementById(`text-${id}`);
    const old   = span.textContent;
    const input = document.createElement('input');
    input.type  = 'text';
    input.value = old;
    span.replaceWith(input);
    input.focus();

    input.onkeyup = async e => {
      if (e.key === 'Enter') {
        const newText = input.value.trim();
        if (newText && newText !== old) {
          await fetch(`/edit/${id}`, {
            method : 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body   : JSON.stringify({ text: newText })
          });
        }
        loadList();
      }
      if (e.key === 'Escape') loadList();
    };
  }

  // первая загрузка
  loadList();
</script>

</body>
</html>
